name: Build & Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            artifact_name: vfsimport-linux-x64
          - os: ubuntu-latest
            target: linux-arm64
            artifact_name: vfsimport-linux-arm64
            compile_target: bun-linux-arm64
          - os: macos-latest
            target: darwin-arm64
            artifact_name: vfsimport-darwin-arm64
          - os: macos-13
            target: darwin-x64
            artifact_name: vfsimport-darwin-x64
          - os: windows-latest
            target: windows-x64
            artifact_name: vfsimport-windows-x64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Binary (Native)
        if: ${{ !matrix.compile_target }}
        run: |
          mkdir -p dist
          bun build --compile --minify index.ts --outfile dist/${{ matrix.artifact_name }}

      - name: Build Binary (Cross Compile)
        if: ${{ matrix.compile_target }}
        run: |
          mkdir -p dist
          bun build --compile --minify --target=${{ matrix.compile_target }} index.ts --outfile dist/${{ matrix.artifact_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
